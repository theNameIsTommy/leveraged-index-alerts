name: Leveraged Index Alerts

on:
  schedule:
    # Runs after the prior US trading day and London session have finished.
    # Tuesday through Saturday, 01:17 Amsterdam time. GitHub usually starts
    # scheduled runs 1-4 hours late; that is harmless for daily-close signals.
    # The Saturday run also sends a weekly status summary to Telegram.
    - cron: "17 1 * * 2-6"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual run mode"
        required: true
        default: "status"
        type: choice
        options:
          - status
          - test-telegram
          - summary-telegram
          - live

permissions:
  contents: write

concurrency:
  group: leveraged-index-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    env:
      ASSET_CONFIG: config/assets.json
      MAX_DATA_AGE_DAYS: ${{ vars.MAX_DATA_AGE_DAYS || '5' }}
      TIMEZONE: Europe/Amsterdam
      STATE_FILE: state/runtime.json
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the branch tip, not the triggering commit, so a queued run
          # sees state committed by the run before it and cannot resend an alert.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install .

      - name: Run scheduled alerts
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: leveraged-alerts run --notify

      - name: Weekly status summary
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(TZ=Europe/Amsterdam date +%u)" = "6" ]; then
            leveraged-alerts summary-telegram --weekly
          else
            echo "Weekly summary is sent on Saturdays only."
          fi

      - name: Manual status
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'status'
        run: leveraged-alerts status

      - name: Manual Telegram test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-telegram'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: leveraged-alerts test-telegram

      - name: Manual market summary
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'summary-telegram'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: leveraged-alerts summary-telegram

      - name: Manual live evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: leveraged-alerts run --notify

      - name: Commit alert state and heartbeat
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')) }}
        run: |
          if git diff --quiet -- state/runtime.json; then
            echo "No runtime state change to commit."
            exit 0
          fi
          git config user.name "leveraged-index-alerts[bot]"
          git config user.email "leveraged-index-alerts[bot]@users.noreply.github.com"
          git add state/runtime.json
          git commit -m "chore: update alert state [skip ci]"
          git pull --rebase
          git push

      - name: Telegram failure notice
        if: ${{ failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --fail-with-body -o /dev/null -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=ALERT SYSTEM FAILURE: the nightly SMA run failed, so at least one asset was NOT evaluated. A BUY/SELL may be missed until it is fixed. Log: ${RUN_URL}"
