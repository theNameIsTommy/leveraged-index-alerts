name: Leveraged Index Alerts

on:
  schedule:
    # Runs after the prior US trading day and London session have finished.
    # Tuesday through Saturday, 01:17 Amsterdam time.
    - cron: "17 1 * * 2-6"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual run mode"
        required: true
        default: "status"
        type: choice
        options:
          - status
          - test-telegram
          - summary-telegram
          - live

permissions:
  contents: write

concurrency:
  group: leveraged-index-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    env:
      ASSET_CONFIG: config/assets.json
      MAX_DATA_AGE_DAYS: ${{ vars.MAX_DATA_AGE_DAYS || '5' }}
      TIMEZONE: Europe/Amsterdam
      STATE_FILE: state/runtime.json
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install .

      - name: Run scheduled alerts
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: leveraged-alerts run --notify

      - name: Manual status
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'status'
        run: leveraged-alerts status

      - name: Manual Telegram test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-telegram'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: leveraged-alerts test-telegram

      - name: Manual market summary
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'summary-telegram'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: leveraged-alerts summary-telegram

      - name: Manual live evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: leveraged-alerts run --notify

      - name: Commit alert state and heartbeat
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')) }}
        run: |
          if git diff --quiet -- state/runtime.json; then
            echo "No runtime state change to commit."
            exit 0
          fi
          git config user.name "leveraged-index-alerts[bot]"
          git config user.email "leveraged-index-alerts[bot]@users.noreply.github.com"
          git add state/runtime.json
          git commit -m "chore: update alert state [skip ci]"
          git push
