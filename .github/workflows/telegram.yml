name: Telegram Rerun Commands

on:
  schedule:
    # Explicit minutes also refresh registration of this newly added schedule.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Share the nightly lock so both workflows see the latest alert state.
concurrency:
  group: leveraged-index-alerts
  cancel-in-progress: false
  queue: max

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASSET_CONFIG: config/assets.json
      MAX_DATA_AGE_DAYS: ${{ vars.MAX_DATA_AGE_DAYS || '5' }}
      TIMEZONE: Europe/Amsterdam
      STATE_FILE: state/runtime.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Check Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: leveraged-alerts check-messages
      - name: Commit alert state and message cursor
        if: always()
        run: |
          if git diff --quiet -- state/runtime.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "leveraged-index-alerts[bot]"
          git config user.email "leveraged-index-alerts[bot]@users.noreply.github.com"
          git add state/runtime.json
          git commit -m "chore: update alert state and Telegram cursor [skip ci]"
          git push
