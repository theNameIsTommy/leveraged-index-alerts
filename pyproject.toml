[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leveraged-index-alerts"
version = "0.2.0"
description = "Free GitHub Actions alerts for SMA200 hysteresis strategies on gold and broad equity indexes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
leveraged-alerts = "leveraged_alerts.cli:main"
gold-sma-alert = "leveraged_alerts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
